# NEXUS Distributed Architecture - Load Balancer Configuration
# Nginx reverse proxy con session affinity (sticky sessions)

events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Upstream: 3 replicas de CEREBRO API
    upstream nexus_api_cluster {
        # Session affinity basado en IP del cliente
        # Mismo cliente siempre va al mismo backend (mientras esté healthy)
        ip_hash;

        # Replicas (docker-compose service names)
        server nexus-api-1:8003 max_fails=3 fail_timeout=30s;
        server nexus-api-2:8003 max_fails=3 fail_timeout=30s;
        server nexus-api-3:8003 max_fails=3 fail_timeout=30s;

        # Health check interval (nginx Plus feature, simulado con max_fails)
        # Si 3 requests fallan en 30s, marca como down
    }

    # Server block: Load balancer
    server {
        listen 8000;
        server_name localhost;

        # Proxy headers (preserve client info)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings (para streaming responses)
        proxy_buffering off;
        proxy_request_buffering off;

        # All requests → upstream cluster
        location / {
            proxy_pass http://nexus_api_cluster;

            # WebSocket support (para /ws endpoints)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check endpoint del load balancer
        # Retorna 200 si al menos 1 backend está healthy
        location /lb-health {
            access_log off;
            return 200 "Load balancer operational\n";
            add_header Content-Type text/plain;
        }

        # Metrics endpoint (para Prometheus)
        location /nginx-metrics {
            stub_status on;
            access_log off;
        }
    }
}
