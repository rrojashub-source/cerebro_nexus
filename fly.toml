# fly.toml app configuration file generated for nexus-cerebro-api on 2026-01-07T06:12:45-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexus-cerebro-api'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile.flyio"

[env]
  AGENT_ID = "nexus"
  INSTANCE_ID = "fly-iad-1"
  LOG_LEVEL = "info"
  PORT = "8003"

[http_service]
  internal_port = 8003
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
